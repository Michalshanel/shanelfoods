<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a024"/>
      <stop offset="50%" style="stop-color:#f4d03f"/>
      <stop offset="100%" style="stop-color:#d4a024"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32"/>
      <stop offset="100%" style="stop-color:#1a472a"/>
    </linearGradient>
    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B6914"/>
      <stop offset="50%" style="stop-color:#D4A024"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
  </defs>

  <!-- Outer golden ring -->
  <circle cx="25" cy="25" r="23" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Inner green circle -->
  <circle cx="25" cy="25" r="19" fill="url(#greenGrad)"/>

  <!-- Crown/Premium symbol -->
  <path d="M14 16 L18 26 L25 21 L32 26 L36 16 L32 19 L25 14 L18 19 Z" fill="url(#goldGrad)"/>

  <!-- Bowl base - white oval -->
  <ellipse cx="25" cy="36" rx="14" ry="7" fill="#ffffff"/>
  <path d="M11 36 Q11 44 25 44 Q39 44 39 36" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Smaller stylish text inside oval -->
  <text x="25" y="36" font-family="Georgia, Times New Roman, serif" font-size="5" font-weight="700" font-style="italic" fill="url(#textGold)" text-anchor="middle" letter-spacing="0.3">Shanel</text>
  <text x="25" y="41" font-family="Arial, sans-serif" font-size="3.5" font-weight="700" fill="#1a472a" text-anchor="middle" letter-spacing="1">FOODS</text>

  <!-- Steam lines -->
  <path d="M19 26 Q17 22 19 18" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.8" stroke-linecap="round"/>
  <path d="M25 25 Q23 21 25 17" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.8" stroke-linecap="round"/>
  <path d="M31 26 Q29 22 31 18" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.8" stroke-linecap="round"/>
</svg>
