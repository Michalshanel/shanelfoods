<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 55">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a024"/>
      <stop offset="50%" style="stop-color:#f4d03f"/>
      <stop offset="100%" style="stop-color:#d4a024"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32"/>
      <stop offset="100%" style="stop-color:#1a472a"/>
    </linearGradient>
    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B6914"/>
      <stop offset="50%" style="stop-color:#D4A024"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
  </defs>

  <!-- Premium Icon Badge -->
  <g transform="translate(2, 2)">
    <!-- Outer golden ring -->
    <circle cx="25" cy="25" r="24" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

    <!-- Inner green circle -->
    <circle cx="25" cy="25" r="20" fill="url(#greenGrad)"/>

    <!-- Crown/Premium symbol -->
    <path d="M15 18 L18 26 L25 22 L32 26 L35 18 L32 20 L25 16 L18 20 Z" fill="url(#goldGrad)"/>

    <!-- Bowl base - white oval -->
    <ellipse cx="25" cy="35" rx="13" ry="6" fill="#ffffff"/>
    <path d="M12 35 Q12 42 25 42 Q38 42 38 35" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>

    <!-- Smaller stylish text inside oval -->
    <text x="25" y="35" font-family="Georgia, Times New Roman, serif" font-size="4.5" font-weight="700" font-style="italic" fill="url(#textGold)" text-anchor="middle" letter-spacing="0.3">Shanel</text>
    <text x="25" y="39.5" font-family="Arial, sans-serif" font-size="3" font-weight="700" fill="#1a472a" text-anchor="middle" letter-spacing="1">FOODS</text>

    <!-- Steam lines -->
    <path d="M20 26 Q18 23 20 20" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M25 25 Q23 22 25 19" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M30 26 Q28 23 30 20" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- Brand Name - Premium Typography -->
  <text x="60" y="26" font-family="Georgia, Times, serif" font-size="26" font-weight="700" fill="#1a472a">SHANEL</text>

  <!-- Decorative line with diamonds -->
  <line x1="60" y1="32" x2="155" y2="32" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <polygon points="107,32 110,29 113,32 110,35" fill="url(#goldGrad)"/>

  <!-- Tagline -->
  <text x="60" y="46" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#1a472a" letter-spacing="3">FOODS</text>
  <text x="100" y="46" font-family="Inter, -apple-system, sans-serif" font-size="8" fill="#666" letter-spacing="1">• Est. 2025 •</text>

  <!-- Right side leaf accent -->
  <path d="M162 18 Q175 8 178 22 Q168 22 162 18" fill="#2e7d32"/>
  <path d="M162 18 Q170 18 175 22" stroke="#1a472a" stroke-width="0.8" fill="none"/>
</svg>
